<style>
:root{--bg:#fff8e7;--fg:#2b2b3a;--card:#fff;--line:#e8dcc0;--ok:#2fb55a;--no:#e5484d;--acc:#6c5ce7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2e;--fg:#f4f1ff;--card:#2a2842;--line:#403d63}}
:root[data-theme="dark"]{--bg:#1d1b2e;--fg:#f4f1ff;--card:#2a2842;--line:#403d63}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Cairo',system-ui,sans-serif;font-size:18px;line-height:1.7;padding:12px;max-width:640px;margin:auto}
h1,h2{text-align:center;margin:8px 0}
.c{text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
button{font-family:inherit;cursor:pointer;color:var(--fg)}
.sm{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 12px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:3px solid var(--c,var(--acc));border-radius:20px;padding:14px 6px;font-size:18px;font-weight:800}
.card.fin{grid-column:1/-1;--c:#f5a623;background:#f5a62333}
.ic{display:block;font-size:40px}
.box{background:var(--card);border:2px dashed var(--acc);border-radius:16px;padding:10px 14px;margin:10px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px 4px;text-align:center}
.tile.on{border-color:var(--acc);transform:scale(1.04)}
.big{font-size:40px;font-weight:800;line-height:1.5}
.em{font-size:36px}
.tile small{display:block;font-size:14px;opacity:.75;line-height:1.4}
.go{display:block;margin:18px auto;background:var(--acc);color:#fff;border:0;border-radius:18px;padding:12px 28px;font-size:22px;font-weight:800}
.bigq{font-size:44px;text-align:center;background:var(--card);border-radius:20px;padding:12px;margin:10px 0;font-weight:800}
.opts{display:grid;gap:10px}
.opt,.mb{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px;font-size:28px;font-weight:800}
.ok,.d{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.no{background:var(--no)!important;color:#fff!important;animation:sk .3s}
.sel{border-color:var(--acc);background:#6c5ce733}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt>div{display:grid;gap:10px;align-content:start}
.pg{text-align:center;opacity:.7;font-size:15px}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>

return `<svg viewBox="0 0 ${W} ${H+16}" width="100%" role="img" aria-label="رسم بياني لتقدم الدروس">${bars}</svg><small>الأخضر = متقن • الملوّن = قيد التعلّم • الرمادي = لم يبدأ</small>`}
function planFor(P,name){const la=L.map((l,i)=>[l.t,P.b&&P.b[i],P.m&&P.m[i]]),rev=la.filter(x=>x[1]!=null&&!(x[2]>=80)).map(x=>x[0]),nxt=la.filter(x=>x[1]==null).slice(0,3).map(x=>x[0]),ok=la.filter(x=>x[2]>=80).length,er=Object.keys(P.e||{}).slice(0,5);
return `الخطة المقترحة للشهر القادم — الطالب: ${name}\nالمهارات المتقنة: ${ok} من ${L.length}\n1) مراجعة وإتقان: ${rev.join('، ')||'لا يوجد'}\n2) دروس جديدة: ${nxt.join('، ')||'لا يوجد'}\nأكثر الأخطاء: ${er.join(' | ')||'—'}\nالمقترح: ٣ جلسات أسبوعياً، ١٥ دقيقة قراءة + ١٠ دقائق ألعاب + مراجعة الأخطاء.`}
function remoteReport(i){const r=RS[i];if(!r)return;const P=r.data||{},la=L.map((l,j)=>[l.t,P.b&&P.b[j],P.m&&P.m[j],P.a&&P.a[j]]),wk=la.filter(x=>x[1]!=null&&!(x[2]>=80)),sg=la.filter(x=>x[1]>=90),er=Object.entries(P.e||{}).sort((a,b)=>b[1]-a[1]).slice(0,10);
window.RPT=planFor(P,r.name);
app.innerHTML=tb()+`<h2>📊 تقرير: ${esc(r.name)}</h2><div class="box">👦 ${esc(r.name)} — ${esc(r.grade||'')}<br>🕒 آخر نشاط: ${r.updated?dtf(r.updated):'—'} (${ago(r.updated)})<br>✅ دروس متقنة: <b>${esc(r.mastered)}</b> من ${esc(r.total)}<br>🎯 الدقة: <b>${esc(r.acc)}%</b> | 🗓️ أيام: <b>${esc(r.days)}</b> | ⏱️ <b>${esc(r.min)}</b> دقيقة | ⭐ ${esc(r.stars)}</div><h3>📈 التقدّم</h3><div class="box">${chartSVG(P)}</div><h3>📚 الدروس</h3><div class="box"><table><tr><th>الدرس</th><th>أفضل نسبة</th><th>محاولات</th></tr>${la.map((x,j)=>`<tr><td>${j+1}. ${esc(x[0])}</td><td>${x[1]!=null?x[1]+'%':'—'} ${x[2]>=80?'✅':''}</td><td>${x[3]||0}</td></tr>`).join('')}</table></div><h3>🎯 أكثر الأخطاء</h3><div class="box">${er.length?er.map(x=>esc(x[0])+' ('+x[1]+'×)').join('<br>'):'لا أخطاء 👏'}</div><h3>💪 نقاط القوة</h3><div class="box">${sg.length?sg.map(x=>esc(x[0])).join('<br>'):'—'}</div><h3>🔄 تحتاج مراجعة</h3><div class="box">${wk.length?wk.map(x=>esc(x[0])+' ('+x[1]+'%)').join('<br>'):'لا شيء 👏'}</div><h3>🗓️ الخطة المقترحة</h3><div class="box"><pre style="white-space:pre-wrap;font:inherit;font-size:15px;margin:0">${esc(window.RPT)}</pre></div><div class="np"><button class="go" onclick="try{navigator.clipboard.writeText(window.RPT);note('✅ تم النسخ')}catch(e){}">📋 نسخ الخطة</button><button class="go" onclick="window.print()">🖨️ طباعة / PDF</button><button class="go" style="background:var(--no)!important" onclick="delRemote(${i},this)">حذف الطالب من السحابة 🗑️</button></div>`}
async function delRemote(i,b){const r=RS[i];if(!r)return;if(!b.dataset.s){b.dataset.s=1;b.textContent='اضغط مرة أخرى للتأكيد';return}
try{const x=await cget('a=del&key='+encodeURIComponent(tkGet())+'&id='+encodeURIComponent(r.id));if(x.ok){RS.splice(i,1);renderT()}else note('تعذّر الحذف')}catch(e){note('تعذّر الحذف')}}

if(!un)[...app.querySelectorAll('.box')].filter(b=>T.some(t=>b.textContent.includes(t))).forEach(b=>b.remove());
app.insertAdjacentHTML('beforeend',un?`<div class="box"><b>☁️ مزامنة الطلاب (Google Sheet)</b><br><small>الصق رابط Apps Script (ينتهي بـ /exec). بعدها كل طالب يفتح الرابط تظهر بياناته عندك.</small><input id="cuin" class="in" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(cu())}"><button class="sm" onclick="saveCloud()">💾 حفظ الرابط</button> <button class="sm" onclick="shareLink()">🔗 نسخ رابط الطلاب</button><br><button class="sm" onclick="teacherView()">👨‍🏫 لوحة كل الطلاب</button> <button class="sm" onclick="tlock()">🔒 قفل قسم المعلم</button></div>`:`<div class="box c"><button class="sm" onclick="tgate(settings)">🔒 قسم المعلم</button></div>`)};
function saveCloud(){const v=document.getElementById('cuin').value.trim();if(v&&!CLOUD_RE.test(v))return note('الرابط غير صحيح. لازم يكون رابط Apps Script وينتهي بـ /exec');try{v?localStorage.setItem('arCloud',v):localStorage.removeItem('arCloud')}catch(e){}note(v?'✅ تم حفظ الرابط':'تم مسح الرابط')}
function shareLink(){if(!/^https?:/.test(location.protocol))return note('افتح التطبيق من رابطه على الإنترنت أولاً ثم انسخ رابط الطلاب');if(!cu())return note('احفظ رابط المزامنة أولاً');
const u=location.origin+location.pathname+'?c='+encodeURIComponent(cu());try{navigator.clipboard.writeText(u);note('✅ تم نسخ رابط الطلاب')}catch(e){note(esc(u))}}
const welcome1=welcome;welcome=function(){welcome1();app.insertAdjacentHTML('beforeend',cu()?`<p class="c"><button class="sm" onclick="teacherView()">👨‍🏫 لوحة المعلم (كل الطلاب)</button></p>`:'')};

const TRK=['home','welcome','groupScreen','learn','letters','letter','stories','story','writing','trace','rew','fun','shop','settings','dash','teacherView','remoteReport'],
REPL=['learn','trace','story','letter','remoteReport'],RST=['home','welcome'],
SUBS=['qs_','mrun','dstep','fin','review','lch','lquiz','miss','dict','wheel','bub','mem','chal'];
TRK.forEach(n=>{const f=window[n];window[n]=function(...a){if(!BK){if(RST.includes(n))HIST.length=0;const t=HIST[HIST.length-1];
if(t&&t[0]==n&&(REPL.includes(n)||JSON.stringify(t[1])==JSON.stringify(a)))HIST[HIST.length-1]=[n,a];else HIST.push([n,a])}BK=0;SUB=0;return f.apply(this,a)}});
SUBS.forEach(n=>{const f=window[n];window[n]=function(...a){SUB=1;return f.apply(this,a)}});
function back(){if(SUB)SUB=0;else HIST.pop();const p=HIST[HIST.length-1];if(!p)return home();BK=1;window[p[0]](...p[1])}

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

welcome();
